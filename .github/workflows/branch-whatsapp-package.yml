name: Branch package - WhatsApp V8

on:
  push:
    branches: [fix/whatsapp-socket-startup]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify WhatsApp patch
        run: npm run verify:whatsapp-patch

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: npm test

      - name: Build follow-up engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name followup-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --distpath dist-engine
          --workpath build/pyinstaller-followup
          backend/engine.py

      - name: Build purchases engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name compras-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --hidden-import xlrd
          --hidden-import xlwt
          --distpath dist-engine
          --workpath build/pyinstaller-compras
          backend/compras_engine.py

      - name: Verify engines
        shell: pwsh
        run: ./scripts/verify-engines.ps1

      - name: Build Windows installer
        run: npm run build

      - name: Verify packaged engines
        shell: pwsh
        run: ./scripts/verify-packaged-engines.ps1

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: Vyzium-v3.3.7-WhatsApp-V8-Test
          path: |
            dist/Vyzium-Setup.exe
            dist/Vyzium-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7
