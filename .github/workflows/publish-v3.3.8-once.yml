name: Publish Vyzium 3.3.8 Once

on:
  push:
    branches: [main]
    paths:
      - ".release/v3.3.8.publish"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_REPO: "solucionx/Vyzium-Releases"
      RELEASE_TAG: "v3.3.8"
      APP_VERSION: "3.3.8"
      VYZIUM_APP_VERSION: "3.3.8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Guard exact release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne "3.3.8") { throw "Expected package version 3.3.8, got $version" }

      - name: Verify repository safety
        shell: pwsh
        run: ./scripts/verify-repository-safety.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify release channel credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VYZIUM_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "VYZIUM_RELEASE_TOKEN is not configured." }
          gh repo view $env:RELEASE_REPO --json nameWithOwner,visibility | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot access $env:RELEASE_REPO." }
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) { throw "Release $env:RELEASE_TAG already exists. Refusing to overwrite it." }
          $global:LASTEXITCODE = 0

      - name: Install Node dependencies
        run: npm ci

      - name: Verify validated WhatsApp baseline
        run: npm run verify:whatsapp-patch

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run complete tests
        run: npm test

      - name: Build followup engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name followup-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --distpath dist-engine
          --workpath build/pyinstaller-followup
          backend/engine.py

      - name: Build compras engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name compras-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --hidden-import xlrd
          --hidden-import xlwt
          --distpath dist-engine
          --workpath build/pyinstaller-compras
          backend/compras_engine.py

      - name: Verify engines
        shell: pwsh
        run: ./scripts/verify-engines.ps1

      - name: Build Windows installer
        run: npm run build

      - name: Verify packaged engines
        shell: pwsh
        run: ./scripts/verify-packaged-engines.ps1

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vyzium-Windows-3.3.8-Published
          path: |
            dist/Vyzium-Setup.exe
            dist/Vyzium-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish Vyzium 3.3.8 to Vyzium-Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VYZIUM_RELEASE_TOKEN }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:RELEASE_REPO `
            --target main `
            --title "Vyzium v3.3.8" `
            --notes "Vyzium v3.3.8: backup criptografado no Vyzium Server (manual e ao fechar normalmente), correção da primeira conexão do WhatsApp e preservação de sessões existentes." `
            dist/Vyzium-Setup.exe `
            dist/Vyzium-Setup.exe.blockmap `
            dist/latest.yml

          if ($LASTEXITCODE -ne 0) { throw "Failed to publish v3.3.8 to $env:RELEASE_REPO." }
