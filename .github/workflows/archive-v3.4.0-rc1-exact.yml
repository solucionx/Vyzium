name: Archive Vyzium 3.4 RC1 Exact Source

on:
  push:
    branches: [archive/v3.4.0-rc1-ca837ad]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated desktop commit
        uses: actions/checkout@v4
        with:
          ref: ca837ad7a390da403c0ef9cb71a08db6b9003e87
          fetch-depth: 1
      - name: Verify exact commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca837ad7a390da403c0ef9cb71a08db6b9003e87"
          test "$(node -p "require('./package.json').version")" = "3.4.0-rc.1"
      - name: Create source archive
        run: |
          set -euo pipefail
          git archive --format=zip --output=Vyzium-v3.4.0-RC1-Full-Source-ca837ad.zip HEAD
          sha256sum Vyzium-v3.4.0-RC1-Full-Source-ca837ad.zip > Vyzium-v3.4.0-RC1-Full-Source-ca837ad.zip.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Vyzium-v3.4.0-RC1-Full-Source-ca837ad
          path: |
            Vyzium-v3.4.0-RC1-Full-Source-ca837ad.zip
            Vyzium-v3.4.0-RC1-Full-Source-ca837ad.zip.sha256
          if-no-files-found: error
          retention-days: 30
