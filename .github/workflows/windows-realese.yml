name: Windows Release

# Durante a transição para o repositório privado, a publicação é MANUAL.
# Commits e tags no repositório de código NÃO criam Releases automaticamente.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (opcional). Ex.: v3.1.0. Se vazio, usa a versão do package.json."
        required: false
        type: string

# O workflow apenas lê o repositório de código. A permissão para publicar
# em Vyzium-Releases vem exclusivamente do secret VYZIUM_RELEASE_TOKEN.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_REPO: "solucionx/Vyzium-Releases"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar que o repositório não contém bancos ou credenciais privadas
        shell: pwsh
        run: ./scripts/verify-repository-safety.ps1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Resolver versão e tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "v$version"
          }

          if ($tag -ne "v$version") {
            throw "A tag '$tag' não corresponde à versão '$version' do package.json. Use v$version."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VYZIUM_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versão: $version"
          Write-Host "Destino da Release: $env:RELEASE_REPO"
          Write-Host "Release: $tag"

      - name: Validar configuração do canal de Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VYZIUM_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Secret VYZIUM_RELEASE_TOKEN não configurado no repositório de código."
          }
          if ($env:RELEASE_REPO -ne "solucionx/Vyzium-Releases") {
            throw "Destino de Release inesperado: $env:RELEASE_REPO"
          }
          gh repo view $env:RELEASE_REPO --json nameWithOwner,visibility | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível acessar $env:RELEASE_REPO com VYZIUM_RELEASE_TOKEN."
          }

      - name: Instalar dependências Node
        run: npm ci

      - name: Verificar correção do whatsapp-web.js
        run: npm run verify:whatsapp-patch

      - name: Instalar dependências Python
        run: python -m pip install -r backend/requirements.txt

      - name: Executar testes
        run: npm test

      - name: Compilar motor de Acompanhamento
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name followup-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --distpath dist-engine
          --workpath build/pyinstaller-followup
          backend/engine.py

      - name: Compilar motor de Cotação & Mapas
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name compras-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --hidden-import xlrd
          --hidden-import xlwt
          --distpath dist-engine
          --workpath build/pyinstaller-compras
          backend/compras_engine.py

      - name: Verificar motores antes do empacotamento
        shell: pwsh
        run: ./scripts/verify-engines.ps1

      - name: Gerar instalador Windows
        run: npm run build

      - name: Verificar motores dentro do pacote Windows
        shell: pwsh
        run: ./scripts/verify-packaged-engines.ps1

      - name: Guardar instalador como artefato do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Vyzium-Windows-${{ env.APP_VERSION }}
          path: |
            dist/Vyzium-Setup.exe
            dist/Vyzium-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Criar ou atualizar Draft somente no Vyzium-Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VYZIUM_RELEASE_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $releaseRepo = $env:RELEASE_REPO

          # Todos os comandos de Release usam --repo explicitamente para impedir
          # publicação acidental no repositório de código solucionx/Vyzium.
          gh release view $tag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $releaseRepo `
              --target main `
              --draft `
              --title "Vyzium $tag" `
              --notes "Instalador Windows e arquivos de atualização automática do Vyzium $tag."

            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao criar a Release $tag em $releaseRepo."
            }
          } else {
            $release = gh release view $tag --repo $releaseRepo --json isDraft | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "A Release $tag já foi publicada em $releaseRepo. Aumente a versão antes de gerar outra."
            }
          }

          gh release upload $tag `
            dist/Vyzium-Setup.exe `
            dist/Vyzium-Setup.exe.blockmap `
            dist/latest.yml `
            --repo $releaseRepo `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao enviar os arquivos para a Release $tag em $releaseRepo."
          }

          Write-Host "Draft $tag criada/atualizada SOMENTE em $releaseRepo."
          Write-Host "O repositório solucionx/Vyzium não recebeu uma GitHub Release."
