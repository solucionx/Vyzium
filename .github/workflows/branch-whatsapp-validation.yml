name: Branch validation - WhatsApp socket
on:
  push:
    branches: [fix/whatsapp-socket-startup]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Verify WhatsApp patch
        run: npm run verify:whatsapp-patch
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run test suite
        run: npm test
