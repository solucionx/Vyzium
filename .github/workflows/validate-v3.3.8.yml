name: Validate Vyzium 3.3.8 Production Candidate

on:
  push:
    branches:
      - release/v3.3.8-backup-whatsapp

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VYZIUM_APP_VERSION: "3.3.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository safety
        shell: pwsh
        run: ./scripts/verify-repository-safety.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify validated WhatsApp baseline
        run: npm run verify:whatsapp-patch

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run complete tests
        run: npm test

      - name: Build followup engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name followup-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --distpath dist-engine
          --workpath build/pyinstaller-followup
          backend/engine.py

      - name: Build compras engine
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name compras-engine
          --collect-all openpyxl
          --collect-all sqlcipher3
          --hidden-import xlrd
          --hidden-import xlwt
          --distpath dist-engine
          --workpath build/pyinstaller-compras
          backend/compras_engine.py

      - name: Verify engines
        shell: pwsh
        run: ./scripts/verify-engines.ps1

      - name: Build Windows installer
        run: npm run build

      - name: Verify packaged engines
        shell: pwsh
        run: ./scripts/verify-packaged-engines.ps1

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: Vyzium-3.3.8-Production-Candidate
          path: |
            dist/Vyzium-Setup.exe
            dist/Vyzium-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
