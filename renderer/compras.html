<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Vyzium · Cotação &amp; Mapas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="compras.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="assets/vyzium-mark-white.svg" alt=""></div>
      <div><strong>Vyzium</strong><span data-app-version data-app-version-prefix="v">v3.1.24</span></div>
    </div>
    <nav id="navigation">
      <button class="nav-item nav-home" type="button" data-go-home>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10v9h13v-9M9.5 19v-5h5v5"/></svg>
        <span>Visão geral</span>
      </button>
      <button class="nav-item" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="4.5" rx="1.6"/><rect x="13" y="10" width="7.5" height="10.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item active" data-view="items">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h3"/></svg>
        <span>Itens a comprar</span>
      </button>
      <button class="nav-item" data-view="maps">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="4.5" rx="1.6"/><rect x="13" y="10" width="7.5" height="10.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/></svg>
        <span>Mapas de compra</span>
      </button>
      <button class="nav-item" data-view="history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12.5" r="8"/><path d="M12 8v4.5l3 2"/><path d="M9 3.5h6"/></svg>
        <span>Histórico</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6M17.8 17.8l-1.6-1.6M7.8 7.8 6.2 6.2"/></svg>
        <span>Configurações</span>
      </button>
    </nav>
    <button id="logout-account" class="button secondary" type="button" title="Sair da conta Vyzium">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4M8 12h10"/></svg>
      <span>Sair da conta</span>
    </button>
    <button id="check-updates" class="button secondary" type="button">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v10m0 0 3.5-3.5M12 13 8.5 9.5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      <span>Verificar atualizações</span>
    </button>
    <small id="update-status" role="status" aria-live="polite"></small>
    <div class="sidebar-note">
      <span class="dot"></span>
      Desenvolvido por Solucionx
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">SCI → COTAÇÃO → COMPRA</p>
        <h1 id="view-title">Itens a comprar</h1>
      </div>
      <div class="top-actions">
        <button class="button module-switch" type="button" data-switch-module="followup">Acompanhamento</button>
        <button id="import-button" class="button primary">Importar BASE SCI</button>
      </div>
    </header>

    <section id="content" class="content">
      <div class="loading">Carregando...</div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="order-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Fechar">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="update-modal" class="update-modal hidden" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
    <div class="update-modal-card">
      <button id="update-modal-close" class="update-modal-close" aria-label="Fechar">×</button>
      <div class="update-modal-hero">
        <div class="update-modal-brand">
          <img src="assets/vyzium-mark.svg" alt="Vyzium">
          <div><strong>Vyzium</strong><span>Atualização pronta</span></div>
        </div>
      </div>
      <div class="update-modal-body">
        <h2 id="update-modal-title">Atualização pronta</h2>
        <p id="update-modal-message">Reiniciar o Vyzium para instalar?</p>
        <div class="update-modal-actions">
          <button id="update-modal-install" class="button primary" type="button">Reiniciar e instalar</button>
          <button id="update-modal-later" class="button secondary" type="button">Mais tarde</button>
        </div>
      </div>
    </div>
  </div>
  <script src="version.js"></script>
  <script src="whatsapp.js"></script>
  <script src="purchase-model.js"></script>
  <script src="compras-app.js"></script>
  <script src="updates.js"></script>
  <script src="module-switch.js"></script>
  <script src="account.js"></script>
</body>
</html>
